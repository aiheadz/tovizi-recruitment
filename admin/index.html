<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tóvizi Recruitment — Admin</title><style>
:root{--ink:#111315;--muted:#697177;--paper:#f5f6f2;--line:#e1e3de;--accent:#b8ff3d;--red:#e55353}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{font-weight:800;font-size:22px}.brand span{color:#7ea914}.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:700}.btn.light{background:#fff;color:var(--ink)}.btn.red{background:var(--red);border-color:var(--red)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}.stat b{display:block;font-size:30px;margin-top:8px}.muted{color:var(--muted)}.tabs{display:flex;gap:8px;margin:24px 0}.tab{padding:10px 14px;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer}.tab.active{background:var(--ink);color:#fff}.hidden{display:none!important}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;text-transform:uppercase;color:var(--muted)}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef0eb;font-size:12px;font-weight:700}.pill.unread{background:#eaffbd}.actions{display:flex;gap:7px;flex-wrap:wrap}.small{padding:7px 9px;font-size:12px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form .full{grid-column:1/-1}input,textarea,select{width:100%;padding:12px;border:1px solid #d5d9d3;border-radius:9px;font:inherit;background:#fff}.empty{padding:30px;text-align:center;color:var(--muted)}.login{max-width:420px;margin:12vh auto}.error{color:#b42318;margin:10px 0}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:20px}.modalbox{background:#fff;max-width:720px;width:100%;border-radius:18px;padding:24px;max-height:85vh;overflow:auto}.generated-link{margin-top:18px;padding:16px;border:1px solid #d5d9d3;border-radius:12px;background:#f5f6f2}.generated-row{display:flex;gap:8px;align-items:center}.generated-row input{flex:1}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.wrap{padding:16px}.top{align-items:flex-start;gap:10px}.generated-row{flex-direction:column;align-items:stretch}}
</style></head><body><div id="app"></div><script src="/admin/admin.js"></script></body></html>
